name: Verify
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: io_ci
          POSTGRES_PASSWORD: io_ci_ephemeral
          POSTGRES_DB: io_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U io_ci -d io_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache-dependency-path: services/server/go.sum
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm -r --filter './plugins/**' test
      - working-directory: services/server
        env:
          IO_TEST_DATABASE_URL: postgres://io_ci:io_ci_ephemeral@127.0.0.1:5432/io_ci?sslmode=disable
        run: |
          go vet ./...
          go test -race -count=1 ./...
